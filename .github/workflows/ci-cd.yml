name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend Build & Test
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LavaMeuCarroApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal || true
      - name: Publish
        run: dotnet publish src/LavaMeuCarro.API/LavaMeuCarro.API.csproj -c Release -o ./publish

  # Frontend Build
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Website/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type Check
        run: npx tsc --noEmit || true

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker Image
        run: docker build -t lavameucarro-api ./LavaMeuCarroApi
      - name: Build Web Docker Image
        run: docker build -t lavameucarro-web ./Website
      - name: Verify docker-compose
        run: docker compose config

  # Deploy to VPS
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH with Retry (Attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST || '187.127.26.164' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/lavameucarro
            echo "Starting deployment (Attempt 1)..."
            git pull origin main || { echo "Git pull failed"; exit 1; }
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker system prune -f
            echo "Deployment completed successfully"

      - name: Wait before retry 2
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 30
        
      - name: Deploy via SSH with Retry (Attempt 2)
        id: deploy_attempt_2
        continue-on-error: true
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST || '187.127.26.164' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/lavameucarro
            echo "Starting deployment (Attempt 2)..."
            git pull origin main || { echo "Git pull failed"; exit 1; }
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker system prune -f
            echo "Deployment completed successfully"

      - name: Wait before retry 3
        if: steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 60
        
      - name: Deploy via SSH with Retry (Attempt 3 - Final)
        id: deploy_attempt_3
        if: steps.deploy_attempt_2.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST || '187.127.26.164' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/lavameucarro
            echo "Starting deployment (Attempt 3 - Final)..."
            git pull origin main || { echo "Git pull failed"; exit 1; }
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker system prune -f
            echo "Deployment completed successfully"
        
      - name: Deployment failed after 3 attempts
        if: failure()
        run: |
          echo "❌ Deployment failed after 3 attempts. This could be due to:"
          echo "1. VPS is not running or accessible"
          echo "2. SSH key is incorrectly configured in GitHub secrets"
          echo "3. Firewall blocks connections from GitHub Actions runners"
          echo "4. Docker daemon not running on VPS"
          echo ""
          echo "Manual deployment steps:"
          echo "  ssh root@187.127.26.164"
          echo "  cd /opt/lavameucarro"
          echo "  git pull origin main"
          echo "  docker compose down"
          echo "  docker compose build --no-cache"
          echo "  docker compose up -d"
          echo "  docker system prune -f"
          exit 1
