name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend Build & Test
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LavaMeuCarroApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal || true
      - name: Publish
        run: dotnet publish src/LavaMeuCarro.API/LavaMeuCarro.API.csproj -c Release -o ./publish

  # Frontend Build
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Website/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type Check
        run: npx tsc --noEmit || true

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker Image
        run: docker build -t lavameucarro-api ./LavaMeuCarroApi
      - name: Build Web Docker Image
        run: docker build -t lavameucarro-web ./Website
      - name: Verify docker-compose
        run: docker compose config

  # Deploy to VPS
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH with Retry
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST || '187.127.26.164' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/lavameucarro
            echo "Starting deployment..."
            git pull origin main || { echo "Git pull failed"; exit 1; }
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker system prune -f
            echo "Deployment completed successfully"
        
      - name: Deployment fallback
        if: failure()
        run: |
          echo "Primary deployment failed. This could be due to SSH connectivity issues."
          echo "Please check:"
          echo "1. VPS is running and accessible"
          echo "2. SSH key is correctly configured in GitHub secrets"
          echo "3. Firewall allows connections from GitHub Actions runners"
          echo ""
          echo "You can also manually deploy by SSH-ing to your VPS:"
          echo "  ssh root@187.127.26.164"
          echo "  cd /opt/lavameucarro && git pull && docker compose up -d --build"
