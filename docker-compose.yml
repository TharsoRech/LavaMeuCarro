version: '3.8'

services:
  api:
    build:
      context: ./LavaMeuCarroApi
      dockerfile: Dockerfile
    container_name: lavameucarro-api
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=LavaMeuCarro;User Id=sa;Password=4uPYdPr0l6oYPAqUgMmRStdZCqFU;Encrypt=False;TrustServerCertificate=True;
      - Jwt__Secret=lavameucarro-super-secret-key-2024-change-in-production
      - Jwt__Issuer=lavameucarro
      - Jwt__Audience=lavameucarro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lavameucarro-net

  web:
    build:
      context: ./Website
      dockerfile: Dockerfile
    container_name: lavameucarro-web
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - api
    networks:
      - lavameucarro-net

networks:
  lavameucarro-net:
    driver: bridge
